<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Zesto - Food Delivery</title>
<script>
window.addEventListener('error',function(e){
  function show(){
    var box=document.createElement('div');
    box.style.cssText='position:fixed;inset:0;z-index:999999;background:#1a1a1a;color:#fff;padding:20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';
    box.textContent='JS ERROR CAUGHT:\n\n'+(e.message||'')+'\n\nFile: '+(e.filename||'')+'\nLine: '+(e.lineno||'')+':'+(e.colno||'')+'\n\n'+(e.error&&e.error.stack||'');
    (document.body||document.documentElement).appendChild(box);
  }
  if(document.body)show();else document.addEventListener('DOMContentLoaded',show);
});
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
<style>
:root{--primary:#145A32;--bg:#F6F6F6;--surface:#FFFFFF;--line:#E2E8D9;--muted:#6B7280;--accent:#145A32;--accentText:#FFFFFF;--success:#18A957;--radius:16px;--shadow:0 1px 2px rgba(10,10,10,.06),0 8px 24px rgba(10,10,10,.05);--shadow-sm:0 1px 3px rgba(10,10,10,.08);--safe:env(safe-area-inset-bottom,0px);--container:740px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:#111;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.35}
html,body{height:100%}
#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:#fff;backdrop-filter:saturate(120%) blur(6px);border-bottom:1px solid var(--line)}
.topbar-inner{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px}
.title{font-family:Poppins,sans-serif;font-size:20px;font-weight:700;margin:0;color:var(--accent);flex:1}
.wrap{max-width:var(--container);margin:0 auto;padding:16px}
.btn{background:var(--accent);color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:600;display:inline-block}
.btn-block{width:100%;display:block}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--accent)}
.card{background:var(--surface);padding:16px;border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.input-group{margin-bottom:12px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px}
.alert-info{background:#d4e8dc;color:#0d3d22}
.alert-error{background:#fee2e2;color:#7f1d1d}
.loading{text-align:center;padding:40px 20px;color:var(--muted)}
.error{color:#dc2626}
.success{color:var(--success)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <h1 class="title">Zesto</h1>
      <button id="logout-btn" class="btn btn-outline" style="width:auto;padding:8px 16px;display:none"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
  </div>
  <div id="content" class="wrap">
    <div class="loading">Initializing...</div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD5n0pzUiSw8yOK6jy-fVCB1rcpZZ2eddk",
  authDomain: "zesto-29dd8.firebaseapp.com",
  databaseURL: "https://zesto-29dd8-default-rtdb.firebaseio.com",
  projectId: "zesto-29dd8",
  storageBucket: "zesto-29dd8.firebasestorage.app",
  messagingSenderId: "262018581789",
  appId: "1:262018581789:web:3812877b7d63961ace8df4"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let auth = null;
function getAuth() {
  if (auth !== null) return auth;
  try {
    auth = firebase.auth();
  } catch (e) {
    console.warn("Auth unavailable:", e);
    auth = false;
  }
  return auth || null;
}

const productsRef = db.ref('products');
const ordersRef = db.ref('orders');
const usersRef = db.ref('users');

let AUTH_USER = null;
let PRODUCTS = [];
let ORDERS = [];
let USER_PROFILE = null;
let CART = [];

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(msg, duration = 3000) {
  const box = document.createElement('div');
  box.style.cssText = `
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    max-width: 300px;
    text-align: center;
  `;
  box.textContent = msg;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), duration);
}

function money(n) { return '₹' + Math.round(n).toLocaleString(); }

function routeTo(hash) { window.location.hash = hash; }

let initAuthDone = false;
function initAuthListener() {
  if (initAuthDone) return;
  initAuthDone = true;
  
  const _auth = getAuth();
  if (!_auth) return;
  
  _auth.onAuthStateChanged(user => {
    if (user) {
      AUTH_USER = { uid: user.uid, email: user.email };
      loadUserData();
      loadProducts();
      loadOrders();
    } else {
      AUTH_USER = null;
      render();
    }
  });
}

function loadUserData() {
  if (!AUTH_USER) return;
  usersRef.child(AUTH_USER.uid).once('value', s => {
    USER_PROFILE = s.val();
    render();
  });
}

function loadProducts() {
  productsRef.on('value', s => {
    const data = s.val();
    PRODUCTS = data ? Object.keys(data).map(k => ({firebaseKey: k, ...data[k]})) : [];
    render();
  });
}

function loadOrders() {
  if (!AUTH_USER) return;
  ordersRef.on('value', s => {
    const data = s.val();
    if (!data) { ORDERS = []; render(); return; }
    ORDERS = Object.keys(data)
      .map(k => ({firebaseKey: k, ...data[k]}))
      .filter(o => o.userId === AUTH_USER.uid);
    render();
  });
}

function render() {
  const hash = window.location.hash.slice(1) || '/';
  const [route] = hash.split('/').filter(Boolean);
  
  if (!AUTH_USER) {
    if (route === 'signup') renderSignup();
    else renderLogin();
  } else {
    if (route === 'profile') renderProfile();
    else if (route === 'orders') renderOrders();
    else if (route === 'cart') renderCart();
    else renderHome();
  }
}

function renderLogin() {
  const _auth = getAuth();
  if (!_auth) { $('#content').innerHTML = '<div class="alert alert-error">Auth unavailable</div>'; return; }
  
  $('#content').innerHTML = `
    <div class="card" style="max-width: 400px; margin: 40px auto;">
      <h2 style="margin-top: 0;">Login to Zesto</h2>
      <div class="input-group">
        <input type="email" id="login-email" placeholder="Email" />
      </div>
      <div class="input-group">
        <input type="password" id="login-password" placeholder="Password" />
      </div>
      <button class="btn btn-block" id="login-btn">Login</button>
      <p style="text-align: center; margin-top: 16px; margin-bottom: 0;">
        Don't have account? <a href="#/signup" style="color: var(--accent); font-weight: 600;">Sign Up</a>
      </p>
    </div>
  `;
  
  $('#login-btn').addEventListener('click', () => {
    const email = $('#login-email').value;
    const password = $('#login-password').value;
    _auth.signInWithEmailAndPassword(email, password)
      .then(() => { toast('Welcome!'); render(); })
      .catch(e => toast('Error: ' + e.message));
  });
}

function renderSignup() {
  const _auth = getAuth();
  if (!_auth) { $('#content').innerHTML = '<div class="alert alert-error">Auth unavailable</div>'; return; }
  
  $('#content').innerHTML = `
    <div class="card" style="max-width: 400px; margin: 40px auto;">
      <h2 style="margin-top: 0;">Create Account</h2>
      <div class="input-group">
        <input type="text" id="signup-name" placeholder="Full Name" />
      </div>
      <div class="input-group">
        <input type="email" id="signup-email" placeholder="Email" />
      </div>
      <div class="input-group">
        <input type="password" id="signup-password" placeholder="Password" />
      </div>
      <button class="btn btn-block" id="signup-btn">Sign Up</button>
      <p style="text-align: center; margin-top: 16px; margin-bottom: 0;">
        Already have account? <a href="#/login" style="color: var(--accent); font-weight: 600;">Login</a>
      </p>
    </div>
  `;
  
  $('#signup-btn').addEventListener('click', () => {
    const name = $('#signup-name').value;
    const email = $('#signup-email').value;
    const password = $('#signup-password').value;
    
    if (!name || !email || !password) { toast('Fill all fields'); return; }
    
    _auth.createUserWithEmailAndPassword(email, password)
      .then(cred => {
        usersRef.child(cred.user.uid).set({
          email: email,
          name: name,
          createdAt: Date.now()
        }).then(() => {
          AUTH_USER = { uid: cred.user.uid, email: email };
          toast('Account created!');
          render();
        });
      })
      .catch(e => toast('Error: ' + e.message));
  });
}

function renderHome() {
  $('#logout-btn').style.display = 'block';
  
  $('#content').innerHTML = `
    <div class="card">
      <h2 style="margin-top: 0;">Available Restaurants</h2>
      <p style="margin-bottom: 16px; color: var(--muted);">Browse and order from restaurants</p>
      ${PRODUCTS.length === 0 ? `
        <div class="alert alert-info">No restaurants available right now</div>
      ` : `
        <div style="display: grid; gap: 12px;">
          ${PRODUCTS.slice(0, 10).map(p => `
            <div style="padding: 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;" data-product="${p.firebaseKey}">
              <strong>${p.name || 'Product'}</strong>
              <p style="margin: 4px 0 0 0; color: var(--muted); font-size: 13px;">${p.description || ''}</p>
              <p style="margin: 8px 0 0 0; font-weight: 600; color: var(--accent);">${money(p.price || 0)}</p>
            </div>
          `).join('')}
        </div>
      `}
    </div>
    <div class="card">
      <a href="#/orders" class="btn btn-block">My Orders</a>
      <a href="#/cart" class="btn btn-outline btn-block" style="margin-top: 8px;">Cart</a>
      <a href="#/profile" class="btn btn-outline btn-block" style="margin-top: 8px;">Profile</a>
    </div>
  `;
  
  $$('[data-product]').forEach(el => {
    el.addEventListener('click', () => {
      const productId = el.dataset.product;
      CART.push({id: productId, qty: 1});
      toast('Added to cart');
      render();
    });
  });
}

function renderCart() {
  $('#logout-btn').style.display = 'block';
  
  if (CART.length === 0) {
    $('#content').innerHTML = `
      <div class="card">
        <h2 style="margin-top: 0;">Shopping Cart</h2>
        <div class="alert alert-info">Cart is empty</div>
        <a href="#/" class="btn btn-block">Continue Shopping</a>
      </div>
    `;
    return;
  }
  
  const total = CART.reduce((sum, item) => {
    const product = PRODUCTS.find(p => p.firebaseKey === item.id);
    return sum + ((product?.price || 0) * item.qty);
  }, 0);
  
  $('#content').innerHTML = `
    <div class="card">
      <h2 style="margin-top: 0;">Shopping Cart (${CART.length} items)</h2>
      <div>
        ${CART.map((item, i) => {
          const product = PRODUCTS.find(p => p.firebaseKey === item.id);
          return `
            <div style="padding: 12px 0; border-bottom: 1px solid var(--line);">
              <div class="row">
                <span>${product?.name || 'Product'} x ${item.qty}</span>
                <span>${money((product?.price || 0) * item.qty)}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <div style="padding-top: 12px; border-top: 2px solid var(--line); margin-top: 12px;">
        <div class="row" style="font-weight: 700; font-size: 16px;">
          <span>Total</span>
          <span>${money(total)}</span>
        </div>
      </div>
      <button class="btn btn-block" id="checkout-btn" style="margin-top: 16px;">Place Order</button>
      <a href="#/" class="btn btn-outline btn-block" style="margin-top: 8px;">Continue Shopping</a>
    </div>
  `;
  
  $('#checkout-btn').addEventListener('click', () => {
    if (CART.length === 0) { toast('Cart is empty'); return; }
    
    const orderId = ordersRef.push().key;
    const order = {
      userId: AUTH_USER.uid,
      items: CART,
      totalAmount: total,
      status: 'Placed',
      deliveryStatus: 'Pending',
      createdAt: Date.now()
    };
    
    ordersRef.child(orderId).set(order)
      .then(() => {
        toast('Order placed successfully!');
        CART = [];
        routeTo('#/orders');
      })
      .catch(e => toast('Error: ' + e.message));
  });
}

function renderOrders() {
  $('#logout-btn').style.display = 'block';
  
  if (ORDERS.length === 0) {
    $('#content').innerHTML = `
      <div class="card">
        <h2 style="margin-top: 0;">My Orders</h2>
        <div class="alert alert-info">No orders yet</div>
        <a href="#/" class="btn btn-block">Start Ordering</a>
      </div>
    `;
    return;
  }
  
  $('#content').innerHTML = `
    <div class="card">
      <h2 style="margin-top: 0;">My Orders (${ORDERS.length})</h2>
      <div>
        ${ORDERS.map(o => `
          <div style="padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px;">
            <p style="margin: 0 0 8px 0;"><strong>Order #${o.firebaseKey.slice(0, 8)}</strong></p>
            <p style="margin: 0 0 4px 0; font-size: 13px; color: var(--muted);">Status: ${o.status}</p>
            <p style="margin: 0; font-weight: 600; color: var(--accent);">${money(o.totalAmount)}</p>
          </div>
        `).join('')}
      </div>
      <a href="#/" class="btn btn-outline btn-block" style="margin-top: 16px;">Back to Home</a>
    </div>
  `;
}

function renderProfile() {
  $('#logout-btn').style.display = 'block';
  
  $('#content').innerHTML = `
    <div class="card">
      <h2 style="margin-top: 0;">My Profile</h2>
      <p><strong>Name:</strong> ${USER_PROFILE?.name || 'Not set'}</p>
      <p><strong>Email:</strong> ${AUTH_USER?.email}</p>
      <p><strong>Member Since:</strong> ${new Date(USER_PROFILE?.createdAt || Date.now()).toLocaleDateString()}</p>
      <a href="#/" class="btn btn-outline btn-block" style="margin-top: 16px;">Back to Home</a>
    </div>
  `;
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', () => {
  initAuthListener();
  
  $('#logout-btn').addEventListener('click', () => {
    const _auth = getAuth();
    if (_auth) _auth.signOut().then(() => {
      AUTH_USER = null;
      render();
    });
  });
});
</script>
</body>
</html>
