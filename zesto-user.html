const vendorPlansRef=db.ref('vendorPlans');
const vendorHelpVideosRef=db.ref('vendorHelpVideos');
const vendorSettingsRef=db.ref('vendorSettings');

ordersRef.on('value',snap=>{const v=snap.val();ORDERS=v?Object.keys(v).map(k=>({key:k,orderId:k,...v[k]})):[].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))});
productsRef.on('value',snap=>{const v=snap.val();PRODUCTS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];dataFetched.products=true});
ratingsRef.on('value',snap=>{RATINGS=snap.val()||{};dataFetched.ratings=true});
configRef.on('value',snap=>{dataFetched.config=true});
vendorsRef.on('value',snap=>{const v=snap.val();VENDORS_ALL=v?Object.keys(v).map(k=>({uid:k,...v[k]})):[]});
vendorPlansRef.on('value',snap=>{const v=snap.val();VENDOR_PLANS=v?Object.keys(v).map(k=>({id:k,...v[k]})).filter(p=>p.active!==false):[]});
vendorHelpVideosRef.on('value',snap=>{const v=snap.val();VENDOR_HELP_VIDEOS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[]});
vendorSettingsRef.on('value',snap=>{VENDOR_SETTINGS=snap.val()||{maxPrepMinutes:120}});

let selectedCity=readLocal('selectedCity')||'Meerut';
function readLocal(k){try{return localStorage.getItem(k)}catch(e){return null}}
function writeLocal(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function cartTotal(){return CART.reduce((a,it)=>a+(it.price*it.qty),0)}
function cartItemCount(){return CART.reduce((a,it)=>a+it.qty,0)}
function parseRoute(){const h=location.hash.slice(1);const p=h.split('/').filter(x=>x);return{hash:h,parts:p}}
function routeTo(h){location.hash=h}

function initAuthListenerOnce(){
  if(authBootHandled)return;
  authBootHandled=true;
  const a=getAuth();
  if(!a)return;
  a.onAuthStateChanged(u=>{
    AUTH_USER=u;
    if(!u){PROFILE=null;routeTo("#/login");return}
    dataFetched.orders=false;
    usersRef.child(u.uid).once('value',snap=>{
      PROFILE=snap.val()||{uid:u.uid,email:u.email||"",name:u.displayName||"Guest",phone:""};
      ordersRef.orderByChild('uid').equalTo(u.uid).on('value',snap=>{
        const v=snap.val();
        ORDERS=v?Object.keys(v).map(k=>({key:k,orderId:k,...v[k]})):[];
        dataFetched.orders=true;
      });
    });
    const cart=readLocal('cart');
    if(cart)CART=JSON.parse(cart);
    const fav=readLocal('favorites');
    if(fav)FAVORITES=JSON.parse(fav);
  });
}

function checkAndRender(){
  if(!dataFetched.products||!dataFetched.orders||!dataFetched.ratings||!dataFetched.config)return setTimeout(checkAndRender,100);
  render();
  window.addEventListener('hashchange',render);
}

function toast(msg){
  const t=$id("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2e3);
}

function checkCitySelection(){
  if(selectedCity)return;
  const overlay=$id("city-modal-overlay");
  overlay.style.display="flex";
  const box=overlay.querySelector(".city-modal-box");
  const cities=["Meerut","Delhi","Gurugram"];
  cities.forEach(c=>{
    const btn=$new("button",{textContent:c,className:"city-option"});
    btn.onclick=()=>{selectedCity=c;writeLocal("selectedCity",c);overlay.style.display="none";location.reload()};
    box.appendChild(btn);
  });
}

function isProductAvailable(p){
  if(!p.vendorUid)return true;
  const v=VENDORS_ALL.find(x=>x.uid===p.vendorUid);
  if(!v)return false;
  if(v.status!=="Approved"||!v.active)return false;
  const now=new Date();
  if(v.openTime&&v.closeTime){
    const curr=now.getHours()*60+now.getMinutes();
    const oh=parseInt(v.openTime.split(':')[0])||0;
    const om=parseInt(v.openTime.split(':')[1])||0;
    const ch=parseInt(v.closeTime.split(':')[0])||0;
    const cm=parseInt(v.closeTime.split(':')[1])||0;
    const ot=oh*60+om,ct=ch*60+cm;
    if(ot<=ct?curr<ot||curr>=ct:curr<ot&&curr>=ct)return false;
  }
  return true;
}

function editCart(pid,qty){
  if(qty<=0){CART=CART.filter(x=>x.productId!==pid)}else{const ex=CART.find(x=>x.productId===pid);if(ex)ex.qty=qty}
  writeLocal("cart",JSON.stringify(CART));
  if(CART.length){CartView()}else{routeTo("#/shop")}
  renderCartBar();
}

function confirmCOD(){
  const a=getAuth();
  if(!a||!AUTH_USER){toast("Please login first");routeTo("#/login");return}
  const co=JSON.parse(readLocal("checkout")||"{}");
  const orderId="ORD"+Date.now();
  const total=cartTotal()+50;
  const order={
    orderId,
    uid:AUTH_USER.uid,
    items:CART.map(it=>({...it})),
    total,
    status:"Placed",
    deliveryStatus:"Pending",
    address:co,
    paymentMode:"COD",
    createdAt:Date.now(),
    prepTimeMinutes:30,
    liveLocation:{},
    trackingPath:{}
  };
  ordersRef.child(orderId).set(order,err=>{
    if(err){toast("Error placing order");return}
    CART=[];
    writeLocal("cart",JSON.stringify(CART));
    writeLocal("checkout","");
    routeTo("#/confirm");
  });
}

function ConfirmView(){
  showLoader();
  const orderData=ORDERS[0];
  if(!orderData){$("#view").innerHTML="<div style='padding:20px;text-align:center'>No order found</div>";return}
  const items=orderData.items||[];
  const grand=items.reduce((a,it)=>a+((it.price||0)*it.qty+50),0);
  const isDelivered=orderData.deliveryStatus==='Delivered'||orderData.status==='Delivered';
  const isCancelled=orderData.status&&orderData.status.includes('Cancelled');
  let timerHtml='';
  if(!isDelivered&&!isCancelled&&orderData){
    timerHtml=`<div class="card pad" style="margin-bottom:12px;text-align:center;background:#FFF8E1;border-color:#FFE082"><h4 style="margin:0;color:#F57C00;font-family:Poppins"><i class="fa-solid fa-stopwatch"></i> Estimated Delivery</h4><div id="order-timer" style="font-size:32px;font-weight:bold;color:#E65100;margin-top:8px">--:--</div><div style="font-size:12px;color:#F57C00;margin-top:4px">We are preparing your food!</div></div>`;
    setTimeout(()=>{
      const timerEl=$id("order-timer");
      if(!timerEl)return;
      const updateTimer=()=>{
        if(!$id("order-timer"))return clearInterval(intv);
        const liveOrder=ORDERS.find(o=>o.orderId===orderData.orderId)||orderData;
        const currentTimer=liveOrder.prepTimeMinutes||liveOrder.deliveryTimer||30;
        const targetTime=liveOrder.createdAt+currentTimer*60*1000;
        const now=Date.now();
        const diff=targetTime-now;
        if(diff<=0){
          timerEl.textContent="Almost there!";
          clearInterval(intv);
        }else{
          const m=Math.floor(diff/60000);
          const s=Math.floor((diff%60000)/1000);
          timerEl.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} Min`;
        }
      };
      updateTimer();
      const intv=setInterval(updateTimer,1000);
    },100);
  }
  $("#view").innerHTML=`<section style="padding:14px">${timerHtml}<div class="card pad" style="text-align:center"><div class="check-anim"><i class="fa-solid fa-check" style="font-size:36px"></i></div><h2 style="margin:6px 0;font-family:Poppins;color:var(--accentDark)">Thank you!</h2><div class="muted">Order <b>#${escapeHtml(orderData.orderId||"")}</b></div><div class="chip" style="margin-top:8px;background:var(--accentLight);color:var(--accentDark)">${escapeHtml(orderData.status||'Placed')}</div></div><div class="card pad" style="margin-top:12px"><h3 style="margin:0 0 10px;font-family:Poppins;color:var(--accentDark)">Order Summary</h3>${items.map(it=>{const img=PRODUCTS.find(x=>x.id===it.productId)?.imageUrls?.[0]||"";return `<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><img src="${img}" style="width:48px;height:48px;object-fit:cover;border-radius:10px;flex-shrink:0"><div style="flex:1 1 auto;min-width:0"><div style="font-weight:700;overflow-wrap:break-word;word-break:break-word">${escapeHtml(it.name)}</div><div class="muted" style="font-size:13px">Qty ${it.qty}</div></div><div style="font-weight:700;color:var(--accentDark);flex:0 0 auto;white-space:nowrap;text-align:right">${money((it.price||0)*it.qty+50)}</div></div>`}).join("")}<div class="row" style="margin-top:10px"><div style="font-weight:700">Total</div><div style="font-weight:700;color:var(--accentDark)">${money(grand)}</div></div></div><div style="margin:16px 0;display:flex;flex-direction:column;gap:10px"><a class="btn btn-outline btn-block" href="#/shop">Back to Shop</a></div></section>`;
}

function doLogin(){
  const email=$id("login-email")?.value||"";
  const pwd=$id("login-pwd")?.value||"";
  if(!email||!pwd){toast("Please fill all fields");return}
  const a=getAuth();
  if(!a){toast("Auth not available");return}
  a.signInWithEmailAndPassword(email,pwd).then(res=>{
    AUTH_USER=res.user;
    toast("Logged in");
    routeTo("#/home");
  }).catch(e=>{
    toast("Login failed: "+e.message);
  });
}

function saveProfile(){
  const name=$id("profile-name")?.value||"";
  const email=$id("profile-email")?.value||"";
  const phone=$id("profile-phone")?.value||"";
  if(!name||!email||!phone){toast("Please fill all fields");return}
  if(AUTH_USER){
    usersRef.child(AUTH_USER.uid).update({name,email,phone},err=>{
      if(err){toast("Error saving profile");return}
      PROFILE={uid:AUTH_USER.uid,name,email,phone};
      toast("Profile updated");
      routeTo("#/account");
    });
  }
}

apeHtml(order.address?.city||"")}</div></div><button class="btn btn-outline btn-block" onclick="routeTo('#/account/orders')" style="margin-top:16px"><i class="fa-solid fa-arrow-left"></i> Back to Orders</button></section>`;

function renderCartBar(){
  const cnt=cartItemCount();

    $id("fcb-badge").textContent=cnt;

function renderCartSheetBody(){
  if(!CART.length){$id("cart-sheet-body").innerHTML="<div style='text-align:center;padding:40px'><i class='fa-solid fa-cart-shopping' style='font-size:40px;color:var(--muted)'></i><p>Your cart is empty</p></div>";return}
  const items=CART.map(it=>{
    const p=PRODUCTS.find(x=>x.id===it.productId);
    const img=p?.imageUrls?.[0]||"";
    return `<div style="display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)"><img src="${img}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0"><div style="flex:1"><div style="font-weight:700;font-size:14px">${escapeHtml(it.name)}</div><div class="muted" style="font-size:12px">${money(it.price)}</div></div><div style="display:flex;align-items:center;gap:6px"><button class="btn btn-sm btn-outline" onclick="editCart('${it.productId}',${it.qty-1});renderCartSheetBody()"><i class="fa-solid fa-minus"></i></button><span style="font-weight:700;min-width:18px;text-align:center">${it.qty}</span><button class="btn btn-sm btn-outline" onclick="editCart('${it.productId}',${it.qty+1});renderCartSheetBody()"><i class="fa-solid fa-plus"></i></button></div></div>`;
  }).join("");
  const total=cartTotal();
  const btnHtml=`<div style="padding:16px;background:var(--accentLight);border-radius:12px;margin-top:12px"><div class="row" style="margin-bottom:6px"><span>Subtotal</span><span style="font-weight:700">${money(total)}</span></div><div class="row"><span>Shipping</span><span style="font-weight:700">${money(50)}</span></div><div class="sep"></div><div class="row"><span style="font-weight:700">Total</span><span style="font-weight:700;color:var(--accentDark);font-size:15px">${money(total+50)}</span></div></div><button class="btn btn-block" onclick="closeCartSheet();routeTo('#/checkout')" style="margin-top:12px"><i class="fa-solid fa-arrow-right"></i> Checkout</button>`;
  $id("cart-sheet-body").innerHTML=items+btnHtml;
}

function openCartSheet(){
  renderCartSheetBody();

function closeCartSheet(){
  $("#cart-sheet").classList.remove("open");

}

const chatbotToggle=$("#chatbot-toggle"),chatbotPopup=$("#chatbot-popup"),chatbotClose=$("#chatbot-close"),chatbotBody=$("#chatbot-body"),chatbotQuestions=$("#chatbot-questions");
const FAQ_DATA=[{q:"How can I place an order?",a:"Browse our menu, add items to cart, and checkout."},{q:"What are your payment options?",a:"We accept Cash on Delivery and Online Payment via UPI."},{q:"How to become a delivery partner?",a:"Visit 'Join Our Team' from Home or Account section."},{q:"How to contact support?",a:"Email us at sahpaufoodstore@gmail.com or call us at +91 96342 58114."}];
function renderChatbotQ(){chatbotQuestions.innerHTML=FAQ_DATA.map((f,i)=>`<button class="question-chip" data-qi="${i}">${escapeHtml(f.q)}</button>`).join('');$$('.question-chip').forEach(b=>b.addEventListener('click',handleQClick))}
function handleQClick(e){const b=e.target.closest('.question-chip');if(!b)return;const i=parseInt(b.dataset.qi);addMsg(FAQ_DATA[i].q,true);chatbotQuestions.innerHTML='';const t=addMsg('Typing...',false,'typing');setTimeout(()=>{if(t)t.remove();addMsg(FAQ_DATA[i].a,false)},1200)}
function addMsg(text,isUser=false,cls=''){const c=document.createElement('div');c.className=`chatbot-msg-container ${isUser?'user-msg':'bot-msg'}`;const m=document.createElement('div');m.className=`chatbot-msg ${!isUser?'bot':''} ${cls}`;m.textContent=text;c.appendChild(m);chatbotBody.appendChild(c);chatbotBody.scrollTop=chatbotBody.scrollHeight;return cls==='typing'?m:null}
chatbotToggle.addEventListener('click',()=>{chatbotPopup.classList.toggle('visible');if(chatbotPopup.classList.contains('visible')){chatbotBody.innerHTML='';addMsg("Hello! I'm Zesto AI. Select a question:",false);renderChatbotQ()}});
chatbotClose.addEventListener('click',()=>{chatbotPopup.classList.remove('visible');chatbotBody.innerHTML=''});

function render(){
  const{parts}=parseRoute();
  if(!dataFetched.products||!dataFetched.orders||!dataFetched.ratings||!dataFetched.config){showLoader();return}
  hideSplash();
  initAuthListenerOnce();
  const[r,id,sub]=parts;
  const authScreens=["login","signup","forgot-password"];
  if(getAuth()&&!authBootHandled){showLoader();return}
  if(getAuth()&&!AUTH_USER&&!authScreens.includes(r)){routeTo("#/login");return}
  updateTabbar();
  renderCartBar();
  if(!r||r==="home")HomeView();
  else if(r==="shop")ShopView(id?decodeURIComponent(id):null);
  else if(r==="product"&&id)ProductView(id);
  else if(r==="cart")CartView();
  else if(r==="offers")OffersView();
  else if(r==="offer"&&id)OfferDetailView(id);
  else if(r==="login")LoginView();
  else if(r==="signup")SignupView();
  else if(r==="forgot-password")ForgotPasswordView();
  else if(r==="checkout")CheckoutView();
  else if(r==="pay"&&id==="online")OnlinePayView();
  else if(r==="cod"&&id==="review")CODReviewView();
  else if(r==="cod"&&id==="success")CODSuccessView();
  else if(r==="confirm")ConfirmView();
  else if(r==="account"&&id==="orders"&&sub)OrderDetailView(sub);
  else if(r==="account"&&id==="orders")OrdersListView();
  else if(r==="favorites")FavoritesView();
  else if(r==="rewards")MyRewardsView();
  else if(r==="invite")InviteEarnView();
  else if(r==="account")AccountView();
  else if(r==="profile"&&id==="setup")ProfileEditView(true);
  else if(r==="profile")ProfileEditView(false);
  else if(r==="join-team"&&id==="success")JoinTeamSuccessView();
  else if(r==="join-team")JoinTeamView();
  else if(r==="contact-support")ContactSupportView();
  else ShopView();
}

  routeTo("#/confirm");
}

function CODSuccessView(){
  routeTo("#/confirm");
}

(function init(){
  try{
    const params=new URLSearchParams(location.search);
    const refFromLink=params.get('ref');
    if(refFromLink)writeLocal("sf_referral_code",refFromLink.toUpperCase());
  }catch(e){}
  if(location.hash&&location.hash!=="#/home"&&location.hash!=="#/"){
    history.replaceState(null,"",location.pathname+location.search+"#/home");
  }
  showLoader();checkCitySelection();checkAndRender();
})();
